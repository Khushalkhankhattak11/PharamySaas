name: pharmcysas
description: "A complete multi-tenant Pharmacy Management SaaS for Android, iOS and Web."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Supabase Backend
  supabase_flutter: ^2.6.0

  # Push Notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1

  # Printing & Receipts
  pdf: ^3.10.8
  printing: ^5.13.2
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.2

  # QR Codes & Barcodes
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Charts
  fl_chart: ^0.68.0

  # Data, Serialization & Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.2.3
  excel: ^4.0.3
  share_plus: ^10.1.4
  uuid: ^4.4.0
  decimal: ^2.3.3
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lucide_icons_flutter: ^4.0.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.4
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
